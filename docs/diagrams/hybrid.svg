<svg xmlns="http://www.w3.org/2000/svg" width="1454" height="752" viewBox="0 0 1454 752" role="img" aria-labelledby="title desc">
<title id="title">Local Build · Cloud Review</title>
<desc id="desc">Explicit admission, isolated Local Build, deterministic Verify, independent read-only Cloud Review, operator acceptance, then optional protected PR and repository CI. Both workers may share a local or VPS execution host. Build calls explicitly selected local inference; Review calls explicitly selected hosted inference. Configuration does not qualify model quality. Merge, release and deployment have separate authority.</desc>
<rect width="1454" height="752" fill="#fff"/>
<text id="hybrid-title" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="start">
<tspan x="32" y="54.0">Local Build · Cloud Review</tspan>
</text>
<text id="hybrid-subtitle" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start">
<tspan x="32" y="86.0">One Factory execution flow · independently selected inference</tspan>
</text>
<text id="execution-lane" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="32" y="142.0">EXECUTION</tspan>
</text>
<rect id="execution-host" x="232" y="116" width="740" height="218" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
<text id="host-label" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start">
<tspan x="252" y="152.0">Local / VPS execution host · isolated workers</tspan>
</text>
<rect id="issue-admission" x="32" y="194" width="170" height="100" rx="8" fill="#fafafa" stroke="#27272a" stroke-width="1.5"/>
<text id="issue-admission-label" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
<tspan x="117.0" y="239.5">Issue / explicit</tspan>
<tspan x="117.0" y="262.0">admission</tspan>
</text>
<rect id="local-build" x="252" y="194" width="200" height="100" rx="8" fill="#edf4f7" stroke="#356580" stroke-width="1.5"/>
<text id="local-build-label" fill="#356580" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
<tspan x="352.0" y="228.25">Local Build</tspan>
<tspan x="352.0" y="250.75">implement worker</tspan>
<tspan x="352.0" y="273.25">writable checkout</tspan>
</text>
<rect id="deterministic-verify" x="502" y="194" width="200" height="100" rx="8" fill="#fafafa" stroke="#27272a" stroke-width="1.5"/>
<text id="deterministic-verify-label" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
<tspan x="602.0" y="239.5">Deterministic Verify</tspan>
<tspan x="602.0" y="262.0">project checks</tspan>
</text>
<rect id="cloud-review" x="752" y="194" width="200" height="100" rx="8" fill="#f5f0f8" stroke="#76598a" stroke-width="1.5"/>
<text id="cloud-review-label" fill="#76598a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
<tspan x="852.0" y="228.25">Cloud Review</tspan>
<tspan x="852.0" y="250.75">separate context</tspan>
<tspan x="852.0" y="273.25">read-only candidate</tspan>
</text>
<rect id="operator-acceptance" x="1002" y="194" width="180" height="100" rx="8" fill="#fafafa" stroke="#27272a" stroke-width="1.5"/>
<text id="operator-acceptance-label" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
<tspan x="1092.0" y="239.5">Operator</tspan>
<tspan x="1092.0" y="262.0">acceptance</tspan>
</text>
<rect id="protected-pr-ci" x="1232" y="194" width="190" height="100" rx="8" fill="#fafafa" stroke="#27272a" stroke-width="1.5"/>
<text id="protected-pr-ci-label" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">
<tspan x="1327.0" y="228.25">Optional</tspan>
<tspan x="1327.0" y="250.75">protected PR</tspan>
<tspan x="1327.0" y="273.25">repository CI</tspan>
</text>
<g id="admit-build" fill="none" stroke="#52525b" stroke-width="1.5"><path d="M 208 244.0 L 246 244.0"/><polyline points="236,238.0 246,244.0 236,250.0"/></g>
<g id="build-verify" fill="none" stroke="#52525b" stroke-width="1.5"><path d="M 458 244.0 L 496 244.0"/><polyline points="486,238.0 496,244.0 486,250.0"/></g>
<g id="verify-review" fill="none" stroke="#52525b" stroke-width="1.5"><path d="M 708 244.0 L 746 244.0"/><polyline points="736,238.0 746,244.0 736,250.0"/></g>
<g id="review-accept" fill="none" stroke="#52525b" stroke-width="1.5"><path d="M 958 244.0 L 996 244.0"/><polyline points="986,238.0 996,244.0 986,250.0"/></g>
<g id="accept-pr" fill="none" stroke="#52525b" stroke-width="1.5"><path d="M 1188 244.0 L 1226 244.0"/><polyline points="1216,238.0 1226,244.0 1216,250.0"/></g>
<text id="candidate-policy" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="1002" y="342.0">Verify + Review bind the exact</tspan>
<tspan x="1002" y="362.0">candidate and current policy.</tspan>
</text>
<text id="inference-lane" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="32" y="450.0">INFERENCE</tspan>
</text>
<rect id="local-endpoint" x="217" y="460" width="270" height="110" rx="8" fill="#edf4f7" stroke="#356580" stroke-width="1.5"/>
<text id="local-endpoint-label" fill="#356580" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">
<tspan x="352.0" y="501.0">Local inference</tspan>
<tspan x="352.0" y="521.0">operator-controlled hardware</tspan>
<tspan x="352.0" y="541.0">explicit model / endpoint</tspan>
</text>
<rect id="hosted-endpoint" x="717" y="460" width="270" height="110" rx="8" fill="#f5f0f8" stroke="#76598a" stroke-width="1.5"/>
<text id="hosted-endpoint-label" fill="#76598a" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">
<tspan x="852.0" y="501.0">Hosted inference</tspan>
<tspan x="852.0" y="521.0">explicit cloud provider</tspan>
<tspan x="852.0" y="541.0">and model</tspan>
</text>
<g id="build-local-inference" fill="none" stroke="#356580" stroke-width="1.5"><path d="M 352.0 300 L 352.0 454" stroke-dasharray="7 5"/><polyline points="346.0,444 352.0,454 358.0,444"/></g>
<g id="review-hosted-inference" fill="none" stroke="#76598a" stroke-width="1.5"><path d="M 852.0 300 L 852.0 454" stroke-dasharray="7 5"/><polyline points="846.0,444 852.0,454 858.0,444"/></g>
<text id="local-call-label" fill="#356580" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="365" y="418.0">model calls</tspan>
</text>
<text id="cloud-call-label" fill="#76598a" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="865" y="418.0">model calls</tspan>
</text>
<text id="inference-boundary-note" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="1032" y="458.0">Inference location differs from</tspan>
<tspan x="1032" y="478.0">worker hosting. Only selected inference</tspan>
<tspan x="1032" y="498.0">access reaches workers; forge / controller</tspan>
<tspan x="1032" y="518.0">credentials stay outside workers.</tspan>
</text>
<text id="configured-note" fill="#27272a" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start">
<tspan x="217" y="614.0">Configured choices require isolated readiness and independent quality qualification.</tspan>
</text>
<text id="authority-note" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="start">
<tspan x="217" y="652.0">Review is no correctness guarantee or automatic merge.</tspan>
<tspan x="217" y="674.5">Merge, release and application deployment retain separate authority.</tspan>
</text>
<text id="legend" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start">
<tspan x="217" y="716.0">Solid arrows: execution order     Dashed arrows: inference calls</tspan>
</text>
</svg>
