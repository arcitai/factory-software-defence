name: Factory task
description: Describe a business outcome and observable acceptance criteria.
title: "[Factory] "
labels: ["factory:triage"]
body:
  - type: textarea
    id: need
    attributes:
      label: Who needs what to improve?
      description: Describe the problem and concrete desired behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and evidence
      description: What will independently demonstrate that the result works?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, constraints and recovery
      description: Affected repository, allowed changes, non-goals, dependencies and rollback. Link blocking issues.
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Work track
      options:
        - Software
        - Security (use a private channel for sensitive findings)
  - type: textarea
    id: capabilities
    attributes:
      label: Required capabilities
      description: For example browser, tests, platform tools or security review. Name any external operator proof needed. Never paste credentials or sensitive findings into a public issue.
