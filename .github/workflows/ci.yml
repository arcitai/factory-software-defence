name: CI and npm release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run build:dashboard
      - run: npm run check
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run build:dashboard
      - id: release
        run: node scripts/release.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts --tag "$FACTORY_RELEASE_CHANNEL"
        # npm OIDC must match arcitai/factory-software-defence + ci.yml.
        # npm provenance is not currently emitted; OIDC authenticates publication.
        env:
          FACTORY_RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          NPM_CONFIG_PROVENANCE: 'false'
